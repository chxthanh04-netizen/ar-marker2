<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#11231f" />
  <title>Marker 2 | Lầu chuông – Lầu trống</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    :root { --ink: #152820; --pine: #1e594a; --mint: #88e5c5; --cream: #fffdf5; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    body { background: #10231f; touch-action: manipulation; }
    a-scene { position: fixed !important; inset: 0; width: 100%; height: 100%; }
    /* Lớp giao diện phía trên hình camera. */
    .ui { position: fixed; z-index: 20; inset: 0; pointer-events: none; color: white; }
    .topbar { position: absolute; top: max(15px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .brand { padding: 10px 13px; border: 1px solid rgba(255,255,255,.18); background: rgba(13,33,28,.83); backdrop-filter: blur(12px); border-radius: 14px; }
    .brand b { font-size: 14px; font-weight: 700; letter-spacing: .2px; display: block; }
    .brand small { display: block; color: #c6dfd4; font-size: 11px; margin-top: 3px; }
    .badge { padding: 8px 10px; border-radius: 999px; background: rgba(13,33,28,.82); border: 1px solid rgba(255,255,255,.18); white-space: nowrap; font-size: 12px; }
    .badge .dot { width: 7px; height: 7px; background: #f5bc62; display: inline-block; border-radius: 50%; margin-right: 5px; }
    .badge.found .dot { background: #74e7a7; box-shadow: 0 0 8px #74e7a7; }
    .center-hint { position: absolute; top: 43%; width: min(310px, calc(100% - 42px)); left: 50%; transform: translate(-50%,-50%); padding: 16px 20px; text-align: center; background: rgba(13,33,28,.86); border: 1px solid rgba(255,255,255,.20); border-radius: 18px; box-shadow: 0 12px 50px rgba(0,0,0,.22); }
    .center-hint strong { font-size: 15px; display: block; }
    .center-hint span { font-size: 12px; color: #d0ded6; display: block; line-height: 1.55; margin-top: 6px; }
    .hotspot { pointer-events: auto; touch-action: manipulation; cursor: pointer; position: fixed; width: 52px; height: 52px; transform: translate(-50%, -50%); padding: 0; border: 0; background: transparent; z-index: 26; display: none; }
    .hotspot .pulse { position: absolute; border-radius: 100%; border: 2px solid rgba(110,253,225,.85); inset: 8px; animation: pulse 2.0s ease-out infinite; }
    .hotspot .pulse:nth-child(2) { animation-delay: .75s; }
    .hotspot .core { position: absolute; width: 21px; height: 21px; border-radius: 50%; background: #96fff1; border: 4px solid #1c756b; top: 50%; left: 50%; transform: translate(-50%,-50%); box-shadow: 0 0 0 2px white, 0 0 18px 6px rgba(76,234,208,.55); }
    @keyframes pulse { 0% { transform: scale(.5); opacity: 1 } 100% { transform: scale(1.85); opacity: 0 } }
    .hotspot-label { position: absolute; left: 50%; top: 53px; transform: translateX(-50%); font-size: 11px; font-weight: 700; white-space: nowrap; background: rgba(15,35,29,.9); color: white; padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); }
    .panel { pointer-events: auto; position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); left: 12px; right: 12px; margin: 0 auto; max-width: 540px; border-radius: 22px; background: rgba(255,253,245,.97); color: var(--ink); padding: 16px 17px 15px; box-shadow: 0 10px 35px rgba(3,27,19,.3); border: 1px solid rgba(255,255,255,.72); backdrop-filter: blur(12px); display: none; }
    .panel-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .step { font-size: 11px; text-transform: uppercase; letter-spacing: .13em; color: #398472; font-weight: 800; }
    .demo-tag { font-size: 10px; border-radius: 999px; padding: 4px 8px; color: #86633a; background: #fff1d9; }
    h1 { font-size: 19px; line-height: 1.2; margin: 9px 0 8px; letter-spacing: -.02em; }
    .body-copy { font-size: 13px; line-height: 1.55; margin: 0; color: #40524c; max-height: min(25vh, 140px); overflow-y: auto; }
    .tip { font-size: 11px; background: #e9f5ee; color: #2a6c53; border-radius: 10px; padding: 8px 10px; margin: 11px 0; }
    .actions { display: flex; gap: 9px; margin-top: 12px; }
    button { font: inherit; }
    .act { border-radius: 12px; min-height: 43px; cursor: pointer; font-size: 13px; font-weight: 700; padding: 10px 12px; border: 1px solid #d2e2d7; }
    .primary { background: var(--pine); color: #fff; border-color: var(--pine); flex: 1; }
    .secondary { background: #fff; color: var(--pine); }
    .reset { margin-top: 10px; padding: 3px 0; color: #587368; font-size: 11px; background: none; border: 0; text-decoration: underline; cursor: pointer; }
    [hidden] { display: none !important; }
    @media (max-height: 630px) { .panel { padding: 11px 13px; border-radius: 16px; } h1 { font-size: 16px; margin: 5px 0; } .body-copy { max-height: 75px; font-size: 12px; } .tip { margin: 6px 0; } }
  </style>
</head>
<body>
  <a-scene id="arScene" embedded
           vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
           renderer="logarithmicDepthBuffer: true; colorManagement: true; alpha: true; antialias: true"
           arjs="sourceType: webcam; trackingMethod: best; videoTexture: true; debugUIEnabled: false;">
    <a-light type="ambient" intensity="1.15"></a-light>
    <a-light type="directional" intensity="0.9" position="1 3 2"></a-light>
    <!-- Đang dùng Hiro để thử. Khi có marker riêng, đổi sang:
         <a-marker id="marker2" type="pattern" url="assets/marker2.patt" emitevents="true"> -->
    <a-marker id="marker2" preset="hiro" emitevents="true" smooth="true" smooth-count="5" smooth-tolerance="0.01" smooth-threshold="2">
      <!-- Cấp 1: cùng một mô hình 3D dùng cho 2 lầu vì kiến trúc giống nhau. -->
      <a-entity id="level0">
        <a-entity id="towerA" position="-0.34 0 0"></a-entity>
        <a-entity id="towerB" position="0.34 0 0"></a-entity>
      </a-entity>
      <!-- Cấp 2: mô hình riêng cho kiến trúc mái đao. -->
      <a-entity id="level1" visible="false">
        <a-entity id="roof3d" position="0 0 0"></a-entity>
      </a-entity>
      <!-- Cấp 3: mô hình ngói cánh sen. -->
      <a-entity id="level2" visible="false">
        <a-entity id="tile3d" position="0 0 0"></a-entity>
      </a-entity>
    </a-marker>
    <a-entity id="arCamera" camera></a-entity>
  </a-scene>

  <div class="ui">
    <div class="topbar">
      <div class="brand"><b>Khám phá kiến trúc</b><small>Thiền viện Trúc Lâm Phương Nam · Marker 02</small></div>
      <div id="status" class="badge"><span class="dot"></span><span id="statusText">Đang tìm marker</span></div>
    </div>
    <div id="hint" class="center-hint" role="status">
      <strong>Hướng camera vào marker 02</strong>
      <span>Dùng mẫu Hiro để thử. Đặt marker trên mặt phẳng, đủ sáng và giữ điện thoại ổn định.</span>
    </div>
    <button id="hotspot" class="hotspot" type="button" aria-label="Khám phá chi tiết">
      <span class="pulse"></span><span class="pulse"></span><span class="core"></span>
      <span id="hotspotLabel" class="hotspot-label">Khám phá mái đao</span>
    </button>
    <section id="panel" class="panel" aria-live="polite">
      <div class="panel-top"><span id="step" class="step">Cấp 1 / 3</span><span id="demoTag" class="demo-tag">Mô hình minh họa</span></div>
      <h1 id="heading">Lầu chuông – Lầu trống</h1>
      <p id="copy" class="body-copy"></p>
      <div id="tip" class="tip"></div>
      <div class="actions">
        <button id="back" type="button" class="act secondary" hidden>← Trở về</button>
        <button id="next" type="button" class="act primary">Khám phá mái đao →</button>
      </div>
      <button id="reset" class="reset" type="button" hidden>Trở về mô hình tổng thể</button>
    </section>
  </div>

  <script>
  'use strict';

  // =============== 1. CẤU HÌNH DỄ CHỈNH SỬA ===============
  const CONFIG = {
    // true: dựng các khối demo bằng Three.js, dùng ngay khi chưa có .glb.
    // false: dùng ba tệp .glb có tên bên dưới. Lỗi tải sẽ hiện mô hình demo thay thế.
    demoModels: true,
    modelPaths: {
      tower: 'assets/lau-chuong-trong.glb',
      roof: 'assets/mai-dao.glb',
      tile: 'assets/ngoi-canh-sen.glb'
    },
    // Chỗ đặt hotspot tính theo vị trí trong hộp bao 3D của mô hình.
    // x: 0 = bên trái, 1 = bên phải; y: 0 = đáy, 1 = đỉnh; z: 0 = phía sau, 1 = phía trước.
    hotspotRelative: {
      building: {x: 0.51, y: 1.04, z: 0.56},
      roof:     {x: 0.69, y: 0.57, z: 1.02}
    }
  };

  const CONTENT = [
    {
      title: 'Lầu chuông – Lầu trống',
      text: 'Lầu chuông và lầu trống là hai công trình có kiến trúc tương đồng trong khuôn viên Thiền viện Trúc Lâm Phương Nam. Hãy quan sát bố cục và các chi tiết trên mái. [Bổ sung tên ngôi chùa tham chiếu kiến trúc sau khi có nguồn tư liệu xác thực.]',
      tip: 'Chạm vòng sáng trên chóp mái để tìm hiểu kiến trúc mái đao.',
      button: 'Khám phá mái đao →',
      hotspot: 'Khám phá mái đao'
    },
    {
      title: 'Kiến trúc mái đao',
      text: 'Mái đao là chi tiết nhấn mạnh đường nét của phần mái, tạo nhịp điệu và hình dáng cho công trình. Bạn có thể quan sát cấu trúc mái trong không gian 3D và tiếp tục khám phá lớp ngói trang trí.',
      tip: 'Chạm vòng sáng trên mái để xem ngói cánh sen dạng 3D.',
      button: 'Xem ngói cánh sen →',
      hotspot: 'Xem ngói cánh sen'
    },
    {
      title: 'Ngói cánh sen',
      text: 'Đây là mô hình minh họa hình thức ngói cánh sen. Người xem có thể quan sát riêng chi tiết hoa văn và hình khối của viên ngói. Khi thay bằng mô hình thật, phần mô tả cần được đối chiếu ảnh và tư liệu khảo sát.',
      tip: 'Nhấn “Trở về” để quay lại mái đao, hoặc quay về công trình tổng thể.',
      button: '',
      hotspot: ''
    }
  ];

  const $ = (id) => document.getElementById(id);
  const scene = $('arScene');
  const marker = $('marker2');
  const levels = [$('level0'), $('level1'), $('level2')];
  let level = 0;
  let tracking = false;
  let warning = false;
  let ready = false;
  const THREE = AFRAME.THREE;
  const hotPoint = new THREE.Vector3();
  const projected = new THREE.Vector3();

  // =============== 2. GIAO DIỆN VÀ TRẠNG THÁI ===============
  function updateUI() {
    levels.forEach((el, idx) => el.setAttribute('visible', idx === level));
    const item = CONTENT[level];
    $('heading').textContent = item.title;
    $('copy').textContent = item.text;
    $('tip').textContent = item.tip;
    $('step').textContent = `CẤP ${level + 1} / 3`;
    $('next').textContent = item.button;
    $('next').hidden = level === 2;
    $('back').hidden = level === 0;
    $('reset').hidden = level === 0;
    $('hotspotLabel').textContent = item.hotspot;
    $('hotspot').setAttribute('aria-label', item.hotspot || 'Điểm tương tác');
    $('panel').style.display = tracking ? 'block' : 'none';
    $('hint').hidden = tracking;
    $('status').classList.toggle('found', tracking);
    $('statusText').textContent = tracking ? 'Đã nhận diện' : 'Đang tìm marker';
    $('demoTag').textContent = (CONFIG.demoModels || warning) ? 'Mô hình minh họa' : 'Mô hình 3D';
    if (level === 2 || !tracking) $('hotspot').style.display = 'none';
  }

  function goToLevel(next) {
    if (next < 0 || next > 2 || next === level) return;
    level = next;
    updateUI();
  }
  $('next').addEventListener('click', () => goToLevel(level + 1));
  $('back').addEventListener('click', () => goToLevel(level - 1));
  $('reset').addEventListener('click', () => goToLevel(0));
  $('hotspot').addEventListener('click', () => goToLevel(level + 1));

  marker.addEventListener('markerFound', () => { tracking = true; updateUI(); });
  marker.addEventListener('markerLost', () => { tracking = false; updateUI(); });
  window.addEventListener('camera-error', () => {
    $('hint').hidden = false;
    $('hint').querySelector('strong').textContent = 'Không mở được camera';
    $('hint').querySelector('span').textContent = 'Hãy dùng HTTPS hoặc localhost và cho phép trình duyệt sử dụng camera.';
  });


  // =============== TƯƠNG THÍCH CAMERA iOS / SAFARI ===============
  // AR.js tạo phần tử video động. Safari cần phát video trực tiếp trong trang.
  function prepareCameraVideo() {
    const video = document.querySelector('video');
    if (!video) return;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.setAttribute('autoplay', '');
    video.setAttribute('muted', '');
    video.playsInline = true;
    video.muted = true;
    console.info('[Marker2] Camera video ready:',
      {width: video.videoWidth, height: video.videoHeight, paused: video.paused});
  }
  window.addEventListener('arjs-video-loaded', prepareCameraVideo);
  document.addEventListener('arjs-video-loaded', prepareCameraVideo);
  // Kiểm tra lại vì một số phiên bản AR.js không phát sự kiện trên window.
  window.addEventListener('load', () => setTimeout(prepareCameraVideo, 500));

  // =============== 3. VẼ MÔ HÌNH MINH HỌA KHI CHƯA CÓ GLB ===============
  function material(color, extra = {}) {
    return new THREE.MeshStandardMaterial({ color, roughness: .78, metalness: .03, ...extra });
  }
  const MAT = {
    wood: material('#8a5940'), darkWood: material('#533629'), stone: material('#aab0a4'),
    roof: material('#b3694f', {side: THREE.DoubleSide}), trim: material('#efd0a2'),
    bell: material('#d8ae63', {metalness: .55}), clay: material('#d39a77', {side: THREE.DoubleSide})
  };
  function box(parent, w, h, d, x, y, z, mat) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
    m.position.set(x,y,z); parent.add(m); return m;
  }
  function cylinder(parent, r1, r2, h, x,y,z, mat) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,20),mat);
    m.position.set(x,y,z); parent.add(m); return m;
  }
  // Vẽ một mặt mái nghiêng gợn cong đơn giản. Chỉ để kiểm tra tương tác, không phải tư liệu kiến trúc.
  function roofPair(parent, width, depth, y, rise, colorMat = MAT.roof) {
    const verts = [], indices = [];
    const n = 12;
    for (let side=-1; side<=1; side+=2) {
      const base = verts.length/3;
      for (let i=0;i<=n;i++) {
        const t = i/n; // t=0 ở sống mái, t=1 ở diềm
        const x = side * width/2 * t;
        const yy = y + rise*(1-t) + Math.pow(t,5)*.09;
        verts.push(x, yy, -depth/2, x, yy, depth/2);
      }
      for (let i=0;i<n;i++) {
        const a=base+2*i; indices.push(a,a+1,a+2, a+1,a+3,a+2);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(verts,3));
    geo.setIndex(indices); geo.computeVertexNormals();
    parent.add(new THREE.Mesh(geo, colorMat));
    box(parent, .035, .035, depth+.04, 0, y+rise+.01, 0, MAT.trim);
    return parent;
  }
  function demoTower(kind) {
    const g = new THREE.Group();
    box(g, 1.0, .13, .78, 0,.09,0,MAT.stone);
    for (const x of [-.39,.39]) for (const z of [-.29,.29]) {
      box(g,.09,.69,.09,x,.48,z,MAT.darkWood);
      box(g,.16,.05,.16,x,.17,z,MAT.trim);
    }
    box(g, .97,.08,.76,0,.82,0,MAT.wood);
    roofPair(g,1.25,.95,.83,.34);
    if(kind==='bell') {
      cylinder(g,.14,.19,.27,0,.47,0,MAT.bell);
      cylinder(g,.06,.06,.06,0,.65,0,MAT.wood);
    } else {
      const drum = cylinder(g,.16,.16,.29,0,.47,0,MAT.clay);
      drum.rotation.z=Math.PI/2;
      cylinder(g,.05,.05,.1,0,.32,0,MAT.wood);
    }
    return g;
  }
  function demoRoof() {
    const g = new THREE.Group();
    roofPair(g, 1.8, 1.15, .18, .5);
    // Chóp và gờ trang trí đơn giản ở hai đầu sống mái
    for (const z of [-.54,.54]) {
      const end = cylinder(g,.08,.12,.18,0,.88,z,MAT.trim);
      end.rotation.x=.25*(z<0?-1:1);
    }
    for (let x=-.72;x<=.75;x+=.19) for (const z of [-.48,.48]) {
      cylinder(g,.05,.05,.02,x,.3+Math.abs(x)*.06,z,MAT.trim);
    }
    return g;
  }
  function demoTile() {
    const g = new THREE.Group();
    // 3 cánh sen cách điệu. Hình demo này sẽ được thay bằng .glb Blender.
    const shape = new THREE.Shape();
    shape.moveTo(0,-.5); shape.bezierCurveTo(-.31,-.18,-.36,.22,0,.55);
    shape.bezierCurveTo(.36,.22,.31,-.18,0,-.5);
    const geo = new THREE.ExtrudeGeometry(shape,{depth:.09,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:.035,bevelThickness:.025,curveSegments:14});
    for (const [x,y,s] of [[-.25,-.12,.78],[.25,-.12,.78],[0,.06,1]]) {
      const p=new THREE.Mesh(geo,MAT.clay);p.scale.set(s,s,s);p.position.set(x,y,0); g.add(p);
    }
    box(g,.67,.1,.20,0,-.50,-.04,MAT.roof);
    g.rotation.x=-.2;
    return g;
  }

  // Chuẩn hóa kích thước: tránh mỗi file Blender có tỷ lệ khác nhau.
  function fitModel(obj, maxWidth, maxHeight) {
    const copy = obj.clone(true); // tính bounding box độc lập khỏi marker AR
    copy.updateMatrixWorld(true);
    const bounds = new THREE.Box3().setFromObject(copy);
    const size = new THREE.Vector3(); bounds.getSize(size);
    if (!Number.isFinite(size.x) || size.length() < 0.00001) return;
    const factor = Math.min(maxWidth / Math.max(size.x,size.z,.0001), maxHeight/Math.max(size.y,.0001));
    const cx = (bounds.min.x+bounds.max.x)/2;
    const cz = (bounds.min.z+bounds.max.z)/2;
    const p = obj.position.clone();
    obj.scale.multiplyScalar(factor);
    obj.position.set((p.x-cx)*factor,(p.y-bounds.min.y)*factor,(p.z-cz)*factor);
  }

  function setDemo(el, create, maxWidth, maxHeight) {
    const demo=create();
    fitModel(demo,maxWidth,maxHeight);
    el.setObject3D('mesh',demo);
  }
  function loadModel(el, path, create, maxWidth, maxHeight) {
    if (CONFIG.demoModels) { setDemo(el,create,maxWidth,maxHeight); return; }
    el.addEventListener('model-loaded', () => {
      const mesh = el.getObject3D('mesh');
      if(mesh) fitModel(mesh,maxWidth,maxHeight);
    },{once:true});
    el.addEventListener('model-error', () => {
      warning = true;
      console.warn('Không tải được:',path,'— dùng mô hình minh họa.');
      el.removeAttribute('gltf-model');
      setDemo(el,create,maxWidth,maxHeight);
      updateUI();
    },{once:true});
    el.setAttribute('gltf-model',`url(${path})`);
  }

  // =============== 4. HOTSPOT BÁM ĐÚNG VỊ TRÍ MÔ HÌNH TRÊN MÀN HÌNH ===============
  function setHotspotPosition() {
    if (!ready || !tracking || level===2 || !scene.camera) {
      $('hotspot').style.display='none'; return;
    }
    const el = level===0 ? $('towerA') : $('roof3d');
    if (!el.getObject3D('mesh')) { $('hotspot').style.display='none'; return; }
    marker.object3D.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(el.object3D);
    if (b.isEmpty()) { $('hotspot').style.display='none'; return; }
    const pos = CONFIG.hotspotRelative[level===0 ? 'building' : 'roof'];
    hotPoint.set(
      THREE.MathUtils.lerp(b.min.x,b.max.x,pos.x),
      THREE.MathUtils.lerp(b.min.y,b.max.y,pos.y),
      THREE.MathUtils.lerp(b.min.z,b.max.z,pos.z)
    );
    projected.copy(hotPoint).project(scene.camera);
    const rect = scene.canvas?.getBoundingClientRect();
    if (!rect || projected.z < -1 || projected.z > 1) { $('hotspot').style.display='none'; return; }
    const x=rect.left+(projected.x+1)*rect.width/2;
    const y=rect.top+(1-projected.y)*rect.height/2;
    if (x < 0 || y < 0 || x > innerWidth || y > innerHeight) { $('hotspot').style.display='none';return; }
    const h=$('hotspot'); h.style.left=`${x}px`; h.style.top=`${y}px`; h.style.display='block';
  }

  function init() {
    if(ready) return;
    ready=true;
    loadModel($('towerA'),CONFIG.modelPaths.tower,()=>demoTower('bell'),.48,.59);
    loadModel($('towerB'),CONFIG.modelPaths.tower,()=>demoTower('drum'),.48,.59);
    loadModel($('roof3d'),CONFIG.modelPaths.roof,demoRoof,1.02,.61);
    loadModel($('tile3d'),CONFIG.modelPaths.tile,demoTile,.53,.66);

    function tick(){ setHotspotPosition(); requestAnimationFrame(tick); }

  if(scene.hasLoaded) init();
  else scene.addEventListener('loaded',init,{once:true});
